<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Air Node 3D</title>
<style>
  :root{
    --bg:#0d1512; --panel:#111c18ee; --panel2:#16241f; --line:#24352f; --text:#e6efe9; --muted:#93a8a0;
    --green:#2f8f5b; --green2:#1f5e3b; --blue:#5b9bd5; --accent:#7cc4ff; --warn:#ffb547;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .topbar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:linear-gradient(#0d1512,#0d1512cc);border-bottom:1px solid var(--line);z-index:5}
  .brand{font-weight:700;font-size:18px;letter-spacing:.2px}
  .brand b{color:#3fae6f}.brand i{color:var(--blue);font-style:normal}
  .topbar .sub{color:var(--muted);font-size:13px}
  .topbar a{margin-left:auto;color:var(--accent);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:6px 10px;border-radius:8px}
  .topbar a+a{margin-left:0}
  .side{position:fixed;top:64px;left:12px;bottom:12px;width:290px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;z-index:4;backdrop-filter:blur(6px)}
  .side h3{margin:14px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .side h3:first-child{margin-top:0}
  .ctrl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
  .ctrl input[type=range]{width:150px;accent-color:#3fae6f}
  .btns{display:flex;flex-wrap:wrap;gap:6px}
  button,.chip{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:12.5px;cursor:pointer}
  button:hover{border-color:#3fae6f}
  button.on{background:#1f5e3b;border-color:#3fae6f}
  .list .grp{color:var(--muted);font-size:11.5px;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.06em}
  .item{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;cursor:pointer;font-size:13px}
  .item:hover{background:#1b2c26}
  .item.sel{background:#1f5e3b}
  .num{min-width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:#24352f;font-size:11px;font-weight:700}
  .item.sel .num{background:#3fae6f;color:#06130c}
  .detail{position:fixed;top:64px;right:12px;bottom:12px;width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;overflow:auto;z-index:4;backdrop-filter:blur(6px)}
  .detail h2{margin:0 0 2px;font-size:19px}
  .detail .part{color:var(--accent);font-size:13px;margin-bottom:8px}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#1f5e3b;color:#c9f2d9;margin-right:6px}
  .detail p{margin:8px 0;color:#cfdcd6}
  .detail h4{margin:16px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td,th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:600}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle;border:1px solid #0006}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .kpi div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}
  .kpi b{display:block;font-size:15px}
  .kpi span{color:var(--muted);font-size:11.5px}
  .note{border-left:3px solid var(--warn);background:#2a2214;padding:8px 10px;border-radius:6px;color:#f3dcb4;font-size:12.5px;margin-top:10px}
  .legend .row{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 4px;cursor:pointer;border-radius:5px}
  .legend .row:hover{background:#1b2c26}
  .hotspot{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;transform:translateY(-14px);user-select:none}
  .hotspot .dot{width:22px;height:22px;border-radius:50%;background:#3fae6fdd;color:#04110a;font:700 11px/22px system-ui;text-align:center;box-shadow:0 0 0 3px #3fae6f44}
  .hotspot .lbl{background:#0d1512dd;border:1px solid var(--line);padding:2px 7px;border-radius:6px;font-size:11.5px;white-space:nowrap;opacity:0;transition:opacity .15s}
  .hotspot:hover .lbl,.hotspot.sel .lbl,.showNames .hotspot .lbl{opacity:1}
  .hotspot.sel .dot{background:#7cc4ff;box-shadow:0 0 0 4px #7cc4ff55}
  #tip{position:fixed;pointer-events:none;background:#0d1512ee;border:1px solid var(--line);padding:4px 8px;border-radius:6px;font-size:12px;z-index:9;display:none}
  .hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#0d1512cc;border:1px solid var(--line);padding:6px 12px;border-radius:999px;color:var(--muted);font-size:12px;z-index:3}
  @media (max-width:900px){
    .side{top:auto;bottom:0;left:0;right:0;width:auto;height:34vh;border-radius:12px 12px 0 0}
    .detail{top:auto;bottom:34vh;left:0;right:0;width:auto;height:30vh;border-radius:12px 12px 0 0}
    .hint{display:none}
    .topbar .sub{display:none}
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<body>
<div id="app"></div>
<div class="topbar">
  <div class="brand"><b>Smart</b> <i>air</i> · Node</div>
  <div class="sub">Demonstração 3D dos componentes — clique em qualquer peça, número ou fio</div>
  <a href="index.html">Início</a>
  <a href="simulacao.html">Simulação da sala →</a>
</div>

<aside class="side">
  <h3>Vista</h3>
  <div class="ctrl"><span>Explodir</span><input id="explode" type="range" min="0" max="1" step="0.01" value="0"></div>
  <div class="btns">
    <button data-view="front">Frente</button>
    <button data-view="iso">Isométrica</button>
    <button data-view="side">Lateral</button>
    <button data-view="back">Traseira</button>
    <button data-view="wall">Na parede</button>
  </div>
  <h3>Exibir</h3>
  <div class="btns">
    <button id="bShell" class="on">Carcaça: opaca</button>
    <button id="bWires" class="on">Conexões</button>
    <button id="bLabels" class="on">Números</button>
    <button id="bNames">Nomes</button>
    <button id="bWall">Parede</button>
    <button id="bRotate">Girar</button>
  </div>
  <h3>Caixa</h3>
  <div class="btns">
    <button id="bCaseProd" class="on">Produção (branca)</button>
    <button id="bCasePrint">Impressão 3D (preta)</button>
  </div>
  <div id="stlLinks" style="display:none;margin-top:6px;font-size:12px;color:var(--muted)">STL: <a href="caixa-3d/base.stl" style="color:var(--accent)">base</a> · <a href="caixa-3d/tampa.stl" style="color:var(--accent)">tampa</a> · <a href="caixa-3d/suporte.stl" style="color:var(--accent)">suporte</a> · <a href="caixa-3d/smartair_caixa.scad" style="color:var(--accent)">.scad</a></div>
  <h3>Componentes</h3>
  <div class="list" id="list"></div>
  <h3>Legenda das conexões</h3>
  <div class="legend" id="legend"></div>
</aside>

<aside class="detail" id="detail"></aside>
<div id="tip"></div>
<div class="hint">Arraste para girar · roda do mouse para zoom · botão direito para mover</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------
   Escala: 1 unidade = 1 cm. Frente do dispositivo aponta para +Z.
   --------------------------------------------------------------- */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', top: 0, left: 0, pointerEvents: 'none' });
app.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1512);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 500);
camera.position.set(20, 11, 28);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 1.5);
controls.minDistance = 6; controls.maxDistance = 120;

scene.add(new THREE.HemisphereLight(0xdfefff, 0x1a2420, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(14, 22, 26); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25, near: 1, far: 90 });
scene.add(sun);

const grid = new THREE.GridHelper(80, 40, 0x24352f, 0x18251f);
grid.position.y = -7; scene.add(grid);

/* ---------------- helpers ---------------- */
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05, ...o });
function mesh(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m;
}
function box(w, h, d, mat, x, y, z) { return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z); }
function cylZ(r, len, mat, x, y, z, seg = 28) { // cilindro com eixo em Z, base em z
  const g = new THREE.CylinderGeometry(r, r, len, seg); g.rotateX(Math.PI / 2); g.translate(0, 0, len / 2);
  return mesh(g, mat, x, y, z);
}
function textTex(lines, { w = 512, h = 256, bg = '#0b3d22', fg = '#e8fff0', font = 'bold 54px Segoe UI', align = 'center', extra } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
  if (extra) extra(g, w, h);
  g.fillStyle = fg; g.font = font; g.textAlign = align; g.textBaseline = 'middle';
  const arr = Array.isArray(lines) ? lines : [lines];
  arr.forEach((t, i) => g.fillText(t, align === 'center' ? w / 2 : 20, h / 2 + (i - (arr.length - 1) / 2) * (parseInt(font.match(/(\d+)px/)[1]) * 1.15)));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function rrShape(w, h, r, cx = 0, cy = 0, PathCls = THREE.Shape) {
  const s = new PathCls(); const x = cx - w / 2, y = cy - h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
function circlePath(x, y, r) { const p = new THREE.Path(); p.absarc(x, y, r, 0, Math.PI * 2, true); return p; }
function extrude(shape, depth, mat, z) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 24 });
  return mesh(g, mat, 0, 0, z);
}

/* ---------------- dimensões ---------------- */
const W = 12, H = 8, R = 1.1, T = 0.25;      // carcaça 120 x 80 mm
const Z_SPLIT = 2.2, Z_FRONT = 4.4, Z_PCB = 2.2, PCB_T = 0.16, Z_TOP = Z_PCB + PCB_T;

/* ---------------- componentes ---------------- */
const comps = {};   // id -> {group, base, off, info, pins}
const root = new THREE.Group(); scene.add(root);

function addComp(id, base, off, build, pins = {}, labelAt = [0, 0, 1]) {
  const g = new THREE.Group(); g.position.set(...base); g.userData.compId = id;
  build(g);
  g.traverse(o => { if (o.isMesh) o.userData.compId = id; });
  root.add(g);
  comps[id] = { id, group: g, base: new THREE.Vector3(...base), off: new THREE.Vector3(...off), pins, labelAt };
  return g;
}

/* 0. parede (contexto) */
const wallGroup = addComp('parede', [0, 0, -1.6], [0, 0, -15], g => {
  const tex = textTex('', { w: 256, h: 256, bg: '#d9d4cc', extra: (c, w, h) => { for (let i = 0; i < 2500; i++) { c.fillStyle = `rgba(0,0,0,${Math.random() * 0.06})`; c.fillRect(Math.random() * w, Math.random() * h, 2, 2); } } });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(4, 3);
  g.add(box(44, 30, 2.2, M(0xd9d4cc, { map: tex, roughness: 0.95 }), 0, 0, 0));
}, {}, [-16, 10, 1.2]);
wallGroup.visible = false;

/* 1. fita VHB */
addComp('vhb', [0, 0, -0.5], [0, 0, -9], g => {
  const foam = M(0x8a8f93, { roughness: 0.9 });
  g.add(box(7, 1.2, 0.11, foam, 0, 1.9, 0));
  g.add(box(7, 1.2, 0.11, foam, 0, -1.9, 0));
  const liner = M(0xc62828, { roughness: 0.8 });
  g.add(box(7.2, 1.25, 0.02, liner, 0, 1.9, -0.07));
  g.add(box(7.2, 1.25, 0.02, liner, 0, -1.9, -0.07));
}, {}, [3.8, 2.6, 0]);

/* 2. fixação (parafusos + buchas) */
addComp('fixacao', [0, 0, -0.45], [0, 0, -12], g => {
  const steel = M(0xb8bec6, { metalness: 0.9, roughness: 0.3 });
  const nylon = M(0xf2f2e9, { roughness: 0.7 });
  for (const x of [-3.5, 3.5]) {
    g.add(cylZ(0.2, 3.0, steel, x, 0, -2.8));
    g.add(cylZ(0.42, 0.15, steel, x, 0, 0.2));
    g.add(cylZ(0.32, 2.9, nylon, x, 0, -3.2 - 0.3));
  }
}, {}, [4.4, 0.6, 0]);

/* 3. suporte de parede */
addComp('suporte', [0, 0, -0.45], [0, 0, -6], g => {
  const pl = M(0xf4f6f5, { roughness: 0.6 });
  const s = rrShape(9, 6.2, 0.8);
  s.holes.push(circlePath(-3.5, 0, 0.25), circlePath(3.5, 0, 0.25));
  g.add(extrude(s, 0.4, pl, 0));
  // ganchos da trava por torção
  for (const [x, y] of [[-2.6, 2.4], [2.6, 2.4], [-2.6, -2.4], [2.6, -2.4]]) g.add(box(1.2, 0.35, 0.35, pl, x, y, 0.55));
  // cunha de inclinação 15° e nível de bolha
  const bub = M(0x9be7a8, { transparent: true, opacity: 0.8 });
  g.add(cylZ(0.35, 0.1, bub, 0, 2.2, 0.4));
}, {}, [-4.6, -3.0, 0.4]);

/* 4. carcaça traseira */
const shellMats = [];
function shellMat(c) { const m = M(c, { roughness: 0.42, transparent: true, opacity: 1 }); shellMats.push(m); return m; }
addComp('traseira', [0, 0, 0], [0, 0, -3], g => {
  const mat = shellMat(0xf3f5f4);
  g.add(extrude(rrShape(W, H, R), 0.2, mat, 0));
  const ring = rrShape(W, H, R); ring.holes.push(rrShape(W - 2 * T, H - 2 * T, R - T, 0, 0, THREE.Path));
  g.add(extrude(ring, Z_SPLIT - 0.2, mat, 0.2));
  // furo USB-C (indicado por recorte escuro)
  g.add(box(0.3, 1.0, 0.42, M(0x111111), W / 2 - 0.05, -1.9, 0.72));
  // bosses de fixação da PCB
  for (const [x, y] of [[-5.1, 3.1], [5.1, 3.1], [-5.1, -3.1], [5.1, -3.1]]) g.add(cylZ(0.3, Z_PCB - 0.2, mat, x, y, 0.2));
}, {}, [-5.4, 3.6, 1.2]);

/* 5. bateria 18650 */
addComp('bateria', [-0.8, 1.5, 1.2], [0, 0, -1.2], g => {
  const wrap = textTex(['18650 Li-ion', '3,7 V · 3000 mAh'], { w: 1024, h: 256, bg: '#1d5fa8', fg: '#fff', font: 'bold 64px Segoe UI' });
  const geo = new THREE.CylinderGeometry(0.9, 0.9, 6.5, 40); geo.rotateZ(Math.PI / 2);
  g.add(mesh(geo, M(0xffffff, { map: wrap, roughness: 0.35 })));
  const cap = new THREE.CylinderGeometry(0.35, 0.35, 0.15, 24); cap.rotateZ(Math.PI / 2);
  g.add(mesh(cap, M(0xd0d4d8, { metalness: 0.9, roughness: 0.25 }), 3.32, 0, 0));
  // suporte da bateria
  const hold = M(0x1b1b1b, { roughness: 0.8 });
  g.add(box(7.2, 2.0, 0.15, hold, 0, 0, -0.85));
  g.add(box(0.2, 2.0, 1.4, hold, -3.55, 0, -0.2));
  g.add(box(0.2, 2.0, 1.4, hold, 3.55, 0, -0.2));
}, { P: [3.45, 0, 0], N: [-3.6, 0, 0] }, [0, 0, 1.1]);

/* 6. carregador USB-C + proteção */
addComp('carregador', [4.36, -1.9, 0.4], [0, 0, -1.0], g => {
  const tex = textTex(['TP4056', 'USB-C'], { w: 256, h: 192, bg: '#1f3f8f', fg: '#cfe1ff', font: 'bold 40px Segoe UI' });
  g.add(box(2.8, 1.7, 0.12, M(0xffffff, { map: tex }), 0, 0, 0.06));
  g.add(box(0.5, 0.5, 0.15, M(0x111111), -0.4, 0.2, 0.2));
  g.add(box(0.35, 0.35, 0.12, M(0x111111), 0.6, 0.3, 0.18));
  g.add(box(0.75, 0.9, 0.32, M(0xc0c4c8, { metalness: 0.9, roughness: 0.3 }), 1.1, 0, 0.28)); // USB-C
  g.add(box(0.12, 0.12, 0.08, M(0xff3030, { emissive: 0xff2020, emissiveIntensity: 0.6 }), 0.3, -0.6, 0.16));
}, { BP: [-1.2, 0.6, 0.15], BN: [-1.2, 0.25, 0.15], OUTP: [-1.2, -0.25, 0.15], OUTN: [-1.2, -0.6, 0.15] }, [0, -0.4, 0.6]);

/* 7. PCB principal */
addComp('pcb', [0, 0, Z_PCB], [0, 0, 1.6], g => {
  const tex = textTex('', {
    w: 1024, h: 660, bg: '#0f5132', extra: (c, w, h) => {
      c.strokeStyle = '#3e8d5f'; c.lineWidth = 6; c.lineCap = 'round';
      const rnd = (a, b) => a + Math.random() * (b - a);
      for (let i = 0; i < 46; i++) { c.beginPath(); let x = rnd(40, w - 40), y = rnd(40, h - 40); c.moveTo(x, y); for (let k = 0; k < 3; k++) { if (k % 2) x = rnd(40, w - 40); else y = rnd(40, h - 40); c.lineTo(x, y); } c.stroke(); }
      c.fillStyle = '#d8c27a'; for (let i = 0; i < 140; i++) { c.beginPath(); c.arc(rnd(30, w - 30), rnd(30, h - 30), 6, 0, 7); c.fill(); }
      c.fillStyle = '#e9f5ec'; c.font = 'bold 30px Consolas, monospace'; c.fillText('SMART AIR NODE  v1.0', 330, h - 34); c.fillText('ESP32-C3 · PIR · US · LUX · IR', 300, h - 74);
    }
  });
  const s = rrShape(11.2, 7.2, 0.6);
  for (const [x, y] of [[-5.1, 3.1], [5.1, 3.1], [-5.1, -3.1], [5.1, -3.1]]) s.holes.push(circlePath(x, y, 0.18));
  const geo = new THREE.ExtrudeGeometry(s, { depth: PCB_T, bevelEnabled: false });
  // mapeia UV para o retângulo
  geo.computeBoundingBox(); const uv = geo.attributes.uv, pos = geo.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (pos.getX(i) + 5.6) / 11.2, (pos.getY(i) + 3.6) / 7.2);
  g.add(mesh(geo, M(0xffffff, { map: tex, roughness: 0.6 })));
}, {}, [-5.0, -3.2, 0.3]);

/* 8. ESP32-C3 */
addComp('esp', [-3.6, 1.35, Z_TOP], [0, 0, 2.6], g => {
  g.add(box(1.8, 2.25, 0.12, M(0x111a2e), 0, 0, 0.06));
  const shield = textTex(['ESP32-C3', 'Espressif'], { w: 256, h: 256, bg: '#c9ced3', fg: '#333', font: 'bold 42px Segoe UI' });
  g.add(box(1.25, 1.2, 0.22, M(0xffffff, { map: shield, metalness: 0.6, roughness: 0.35 }), 0, -0.15, 0.23));

  m.userData.net = w[4]; m.userData.wire = w; wireGroup.add(m); return m;

function pinWorld(id, pin) {
  const c = comps[id]; const p = new THREE.Vector3(...(c.pins[pin] || [0, 0, 0]));

function updateWires() {
  for (const m of wireMeshes) {
    const [a, ap, b, bp] = m.userData.wire;
    const p0 = pinWorld(a, ap), p3 = pinWorld(b, bp);
    const lift = 0.6 + p0.distanceTo(p3) * 0.12;
    const p1 = p0.clone().lerp(p3, 0.3); p1.z = Math.max(p0.z, p3.z) + lift;
    const p2 = p0.clone().lerp(p3, 0.7); p2.z = Math.max(p0.z, p3.z) + lift;
    const curve = new THREE.CatmullRomCurve3([p0, p1, p2, p3]);
    m.geometry.dispose(); m.geometry = new THREE.TubeGeometry(curve, 24, 0.045, 6, false);
  }
}

  • Clique em um fio ou na legenda para ver o sinal.<br>
  • Use <b>Explodir</b> para separar as camadas e <b>Carcaça</b> para o modo raio-X.<br>
  • <b>Na parede</b> mostra o dispositivo instalado.</p>
  <h4>Fluxo de energia</h4>
  <p>USB-C → carregador → 18650 → LDO 3,3 V → ESP32-C3 + PIR (sempre ligados). Os demais sensores ficam desligados pelo P-MOSFET até serem necessários.</p>`;
}
function connRow([pin, to, net]) {
  const sw = net && NETS[net] ? `<span class="sw" style="background:${NETS[net].c}"></span>` : '';
  return `<tr><td>${sw}<b>${pin}</b></td><td>${to}</td></tr>`;
}
function showInfo(id) {
  const i = INFO[id]; if (!i) return overview();
  detail.innerHTML = `
    <span class="badge">${i.cat}</span><span class="badge" style="background:#24352f">#${NUM[id] || '–'}</span>
    <h2>${i.n}</h2><div class="part">${i.part}</div>
    <p>${i.d}</p>
    ${i.specs.length ? `<h4>Especificação</h4><table>${i.specs.map(([a, b]) => `<tr><th>${a}</th><td>${b}</td></tr>`).join('')}</table>` : ''}
    ${i.pins.length ? `<h4>Conexões</h4><table><tr><th>Pino</th><th>Liga em</th></tr>${i.pins.map(connRow).join('')}</table>` : ''}
    <div class="kpi"><div><b>${i.cost}</b><span>custo</span></div><div><b>${i.pow}</b><span>consumo</span></div></div>
    ${i.note ? `<div class="note">${i.note}</div>` : ''}
    <p style="margin-top:14px"><button id="back">← Visão geral</button></p>`;
  document.getElementById('back').onclick = () => select(null);
}
function showNet(net) {
  const n = NETS[net]; const ws = WIRES.filter(w => w[4] === net);
  detail.innerHTML = `<span class="badge">Conexão</span>
    <h2><span class="sw" style="background:${n.c};width:14px;height:14px"></span>${n.n}</h2>
    <p>${n.d}</p>
    <h4>Trechos</h4><table><tr><th>De</th><th>Para</th></tr>${ws.map(w => `<tr><td>${INFO[w[0]].n} · ${w[1]}</td><td>${INFO[w[2]].n} · ${w[3]}</td></tr>`).join('')}</table>
    <p style="margin-top:14px"><button id="back">← Visão geral</button></p>`;
  document.getElementById('back').onclick = () => select(null);
}

/* ---------------- seleção / destaque ---------------- */
let selected = null, selectedNet = null, hovered = null;
function setEmissive(id, color, intensity) {
  if (!comps[id]) return;
  comps[id].group.traverse(o => {
    if (o.isMesh && o.material && o.material.emissive) {
      if (o.userData.e0 === undefined) { o.userData.e0 = o.material.emissive.getHex(); o.userData.ei0 = o.material.emissiveIntensity; }
      if (color === null) { o.material.emissive.setHex(o.userData.e0); o.material.emissiveIntensity = o.userData.ei0; }
      else { o.material.emissive.setHex(color); o.material.emissiveIntensity = intensity; }
    }
  });
}
function refreshHighlight() {
  for (const id in comps) setEmissive(id, null);
  if (hovered && hovered !== selected) setEmissive(hovered, 0x3fae6f, 0.25);
  if (selected) setEmissive(selected, 0x2b7fff, 0.55);
  wireMeshes.forEach(m => {
    const on = !selectedNet || m.userData.net === selectedNet || (selected && (m.userData.wire[0] === selected || m.userData.wire[2] === selected));
    m.material.opacity = (selectedNet || selected) && !on ? 0.12 : 1; m.material.transparent = true;
    m.material.emissiveIntensity = on && (selectedNet || selected) ? 0.6 : 0.15;
  });
  listEl.querySelectorAll('.item').forEach(e => e.classList.toggle('sel', e.dataset.id === selected));
  for (const id in hotspotEls) hotspotEls[id].el.classList.toggle('sel', id === selected);
}
function select(id) {
  selected = id; selectedNet = null;
  if (id) showInfo(id); else overview();
  if (id && (id === 'bateria' || id === 'carregador' || id === 'energia' || id === 'pcb') && explodeTarget < 0.5) setExplode(0.6);
  refreshHighlight();
}
function selectNet(net) { selected = null; selectedNet = net; showNet(net); if (explodeTarget < 0.5) setExplode(0.6); refreshHighlight(); }

/* ---------------- interação ---------------- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); const tip = document.getElementById('tip');
let down = null;
function pick(e) {
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const objs = []; root.traverse(o => { if (o.isMesh && o.visible && o.parent.visible && (o.material.opacity > 0.2 || !o.material.transparent)) objs.push(o); });
  const hit = ray.intersectObjects(objs, false).find(h => {
    let p = h.object; while (p) { if (!p.visible) return false; p = p.parent; } return true;
  });
  return hit ? hit.object : null;
}
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const o = pick(e);
  if (!o) return select(null);
  if (o.userData.net) return selectNet(o.userData.net);
  if (o.userData.compId && o.userData.compId !== 'parede') select(o.userData.compId);
});
renderer.domElement.addEventListener('pointermove', e => {
  const o = pick(e);
  const id = o ? (o.userData.net ? null : o.userData.compId) : null;
  const label = o ? (o.userData.net ? NETS[o.userData.net].n : (INFO[id] ? INFO[id].n : '')) : '';
  renderer.domElement.style.cursor = label ? 'pointer' : 'default';
  tip.style.display = label ? 'block' : 'none';
  if (label) { tip.textContent = label; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 12 + 'px'; }
  if (id !== hovered) { hovered = id === 'parede' ? null : id; refreshHighlight(); }
});

/* ---------------- controles ---------------- */
const explodeEl = document.getElementById('explode');
let explode = 0, explodeTarget = 0;
function setExplode(v) { explodeTarget = v; explodeEl.value = v; }
explodeEl.oninput = () => explodeTarget = +explodeEl.value;

let shellMode = 0; // 0 opaca, 1 raio-x, 2 oculta
const bShell = document.getElementById('bShell');
bShell.onclick = () => {
  shellMode = (shellMode + 1) % 3;
  bShell.textContent = 'Carcaça: ' + ['opaca', 'raio-X', 'oculta'][shellMode];
  shellMats.forEach(m => { m.opacity = shellMode === 1 ? 0.16 : 1; m.depthWrite = shellMode !== 1; });
  applyCase();
};
let caseMode = new URLSearchParams(location.search).get('caixa') === '3d' ? 'print' : 'prod';
function applyCase() {
  const prod = caseMode === 'prod', show = shellMode !== 2;
  const vis = { frontal: prod && show, traseira: prod && show, caixa_tampa: !prod && show, caixa_base: !prod && show };
  for (const id in vis) {
    comps[id].group.visible = vis[id];
    hotspotEls[id].el.style.display = vis[id] ? '' : 'none';
    const li = listEl.querySelector('[data-id="' + id + '"]');
    if (li) li.style.display = (prod === (id === 'frontal' || id === 'traseira')) ? '' : 'none';
  }
  comps.suporte.group.traverse(o => { if (o.isMesh && o.material.color && !o.material.transparent) o.material.color.setHex(prod ? 0xf4f6f5 : 0x232326); });
  document.getElementById('bCaseProd').classList.toggle('on', prod);
  document.getElementById('bCasePrint').classList.toggle('on', !prod);
  document.getElementById('stlLinks').style.display = prod ? 'none' : 'block';
  if (selected in vis && !vis[selected]) select(prod ? 'frontal' : 'caixa_tampa');
}
document.getElementById('bCaseProd').onclick = () => { caseMode = 'prod'; applyCase(); };
document.getElementById('bCasePrint').onclick = () => { caseMode = 'print'; applyCase(); if (explodeTarget < 0.3) setExplode(0.55); };
const tog = (btn, fn) => { const b = document.getElementById(btn); b.onclick = () => { b.classList.toggle('on'); fn(b.classList.contains('on')); }; };
tog('bWires', on => wireGroup.visible = on);
tog('bLabels', on => Object.values(hotspotEls).forEach(h => h.obj.visible = on));
tog('bNames', on => document.body.classList.toggle('showNames', on));
tog('bWall', on => { wallGroup.visible = on; grid.visible = !on; });
tog('bRotate', on => controls.autoRotate = on);
controls.autoRotateSpeed = 1.2;

const VIEWS = {
  front: { p: [0, 1, 30], t: [0, 0, 2], e: 0 },
  iso: { p: [20, 11, 28], t: [0, 0, 1.5], e: 0.55 },
  side: { p: [38, 4, 2], t: [0, 0, -1], e: 0.75 },
  back: { p: [-14, 8, -26], t: [0, 0, -2], e: 0.6 },
  wall: { p: [16, -6, 34], t: [0, 0, 0], e: 0, wall: true },
};
let camAnim = null;
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
  const v = VIEWS[b.dataset.view];
  camAnim = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(), p1: new THREE.Vector3(...v.p), t1: new THREE.Vector3(...v.t) };
  setExplode(v.e);
  const wb = document.getElementById('bWall');
  if (v.wall && !wallGroup.visible) wb.click();
  if (!v.wall && wallGroup.visible) wb.click();
  if (v.wall && shellMode !== 0) { while (shellMode !== 0) bShell.click(); }
});

/* ---------------- loop ---------------- */
let lastExplode = -1;
function applyExplode() {
  for (const id in comps) {
    const c = comps[id];
    c.group.position.copy(c.base).addScaledVector(c.off, explode);
  }
  updateWires();
}
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  explode += (explodeTarget - explode) * Math.min(1, dt * 6);
  if (Math.abs(explode - lastExplode) > 1e-4) { applyExplode(); lastExplode = explode; }
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt * 1.4); const s = camAnim.t * camAnim.t * (3 - 2 * camAnim.t);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, s); controls.target.lerpVectors(camAnim.t0, camAnim.t1, s);
    if (camAnim.t >= 1) camAnim = null;
  }
  controls.update();
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
  requestAnimationFrame(loop);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});
overview(); applyCase(); applyExplode(); loop();
setTimeout(() => { if (explodeTarget === 0) setExplode(0.55); }, 1200);
window.__demo = { comps, select, setExplode, setCase: m => { caseMode = m; applyCase(); } };
</script>
</body>
